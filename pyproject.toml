    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydub>=0.25.1",
    "imageio-ffmpeg>=0.4.9",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]
