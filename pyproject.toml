[project]
name = "macpocket"
version = "0.1.1"
description = "MacPocket -- a local-first AI voice note-taker web app"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydub>=0.25.1",
    "sounddevice>=0.4.6",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "openai-whisper>=20231117",
    "ollama>=0.1.7",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]
